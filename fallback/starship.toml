# Fallback snapshot: starship prompt config (trimmed, sanitized).
# Live source: ~/.config/starship.toml

add_newline = true

format = "$username$hostname$directory$git_branch$git_status$custom.git_dirty$cmd_duration$line_break$character"

truncation_length = 2

[username]
format = "[$user](bold blue) "

[hostname]
ssh_only = true
format = "at [$hostname](bold yellow) "

[directory]
style = "bold cyan"
read_only = " "
read_only_style = "red"

[git_branch]
format = "[$branch]($style) "
style = "bold purple"

[git_status]
style = "cyan"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
up_to_date = ""
untracked = ""
modified = ""
stashed = ""
staged = ""
renamed = ""
deleted = ""

[custom.git_dirty]
command = "printf ''"
when = '''git status --porcelain --ignore-submodules=dirty | grep -Eq '^(\?\?|.[MT])' '''
format = "[$output]($style) "
style = "cyan"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
