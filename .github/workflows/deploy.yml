name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # DEPLOY-10: snapshot integrity gate (hard-fail). On CI there are no live
      # ~/.config sources, so this verifies (a) every manifest entry in
      # fallback/README.md has a committed snapshot and (b) the embedded
      # Workers bundle (server/lib/fallbacks.ts) is in sync with fallback/*.
      # Live-source freshness remains a host-side concern (run locally).
      - name: Fallback integrity
        run: bun run fallbacks:check

      - name: Build
        run: bun run build

      # DEPLOY-10 / PERF-03: bundle budget (hard-fail). Pinned at PERF-03 exit:
      # initial (entry) JS measured 68,112 bytes gzip after the per-card split;
      # limit = measured + 5% (rounded up to 71,500). To re-pin after an
      # intentional change: measure `gzip -c dist/<entry> | wc -c`, update LIMIT.
      - name: Bundle budget
        run: |
          entry=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          bytes=$(gzip -c "dist/$entry" | wc -c)
          LIMIT=71500
          echo "initial JS (gzip): $bytes bytes — limit $LIMIT"
          [ "$bytes" -le "$LIMIT" ] || {
            echo "::error::bundle budget exceeded: $bytes > $LIMIT bytes gzip. If intentional, re-pin LIMIT after measuring \`gzip -c dist/<entry> | wc -c\`."
            exit 1
          }

      # PRs: validate the Worker bundles and assets without deploying.
      - name: Wrangler dry-run (PR)
        if: github.event_name == 'pull_request'
        run: bunx wrangler deploy --dry-run

      # main: production deploy. Requires repo secrets
      #   CLOUDFLARE_API_TOKEN     (token with "Edit Cloudflare Workers" template)
      #   CLOUDFLARE_ACCOUNT_ID
      # Skips gracefully when secrets are absent so pushes stay green.
      - name: Wrangler deploy (main)
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set; skipping deploy"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bunx wrangler deploy
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      # DEPLOY-10: post-deploy smoke — the DEPLOY-09 manual assertions, codified.
      # Runs only after a real deploy. Fails the push if the mirror drifts.
      - name: Post-deploy smoke
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          BASE="https://dotfiles-showcase.harlanljones.workers.dev"
          fail() { echo "::error::$1"; exit 1; }
          sleep 5  # version swap is atomic; small settle delay
          for p in / /prompt /palette /desk /dots /annex "/prompt?dirty=1&status=1&state=rebase"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE$p")
            [ "$code" = "200" ] || fail "route $p -> $code (expected 200)"
          done
          curl -sf "$BASE/dots" | grep -q '<div id="root"></div>' \
            || fail "SPA fallback body missing root div"
          curl -sf -X POST "$BASE/api/starship" -H 'Content-Type: application/json' \
            -d '{"branch":"main","dirty":true,"status":1,"shell":"zsh"}' | grep -q '"degraded":true' \
            || fail "degraded:true missing from /api/starship"
          for k in ghostty mise dots; do
            cc=$(curl -sI "$BASE/api/cards/$k" | tr -d '\r' | sed -n 's/^cache-control:[[:space:]]*//Ip' | tr '[:upper:]' '[:lower:]')
            [ "$cc" = "public, max-age=3600, stale-while-revalidate=86400" ] \
              || fail "cards/$k cache-control: '$cc' (expected fallback header)"
          done
          echo "post-deploy smoke: all assertions green"
